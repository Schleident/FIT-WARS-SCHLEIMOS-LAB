<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FIT WARS | Request Coaching</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050505;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #0b0b0b;
            border-bottom: 1px solid #1e90ff;
            padding: 20px;
        }

        .header-content {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .logo {
            color: #1e90ff;
            font-size: 24px;
            font-weight: bold;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            border: 1px solid #1e90ff;
            padding: 10px 16px;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #1e90ff;
            color: black;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 50px 20px;
        }

        .page-title {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .intro {
            color: #888;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .form-container {
            background: #111;
            border: 1px solid #222;
            padding: 35px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: white;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        select,
        textarea,
        input {
            width: 100%;
            background: #080808;
            color: white;
            border: 1px solid #333;
            padding: 14px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            border-radius: 4px;
        }

        select:focus,
        textarea:focus,
        input:focus {
            outline: none;
            border-color: #1e90ff;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            background: #1e90ff;
            color: black;
            border: none;
            padding: 16px;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
        }

        .submit-btn:hover {
            background: white;
        }

        .notice {
            margin-top: 25px;
            padding: 20px;
            background: #0b0b0b;
            border-left: 3px solid #1e90ff;
        }

        .notice p {
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {

            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            main {
                padding: 35px 15px;
            }

            .page-title {
                font-size: 30px;
            }

            .form-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="header-content">

            <div class="logo">
                FIT WARS 🧪
            </div>

            <a href="dashboard.html" class="back-btn">
                ← Back to Dashboard
            </a>

        </div>

    </header>


    <main>

        <h1 class="page-title">Request Coaching</h1>

        <p class="intro">
            Need help with your training? Send your coach a request
            and explain what you need.
        </p>


        <section class="form-container">

            <form id="coachingForm">

                <div class="form-group">

                    <label for="request-type">
                        REQUEST TYPE
                    </label>

                    <select id="request-type" name="request-type">

                        <option value="">
                            Select a request
                        </option>

                        <option value="workout">
                            Workout Change
                        </option>

                        <option value="nutrition">
                            Nutrition Help
                        </option>

                        <option value="form-check">
                            Form Check
                        </option>

                        <option value="general">
                            General Coaching
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="priority">
                        PRIORITY
                    </label>

                    <select id="priority" name="priority">

                        <option value="normal">
                            Normal
                        </option>

                        <option value="important">
                            Important
                        </option>

                        <option value="urgent">
                            Urgent
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="message">
                        YOUR MESSAGE
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="Tell your coach what you need help with..."
                    ></textarea>

                </div>


                <button type="submit" class="submit-btn">
                    SUBMIT COACHING REQUEST
                </button>
<p id="successMessage" style="display:none; color:#1e90ff; margin-top:20px; text-align:center; font-weight:bold;">
    ✓ COACHING REQUEST SENT
</p>
            </form>

        </section>


        <section class="notice">

            <p>
                Your request will be reviewed by your coach.
                Be as specific as possible so we can provide
                the best guidance for your training.
            </p>

        </section>

    </main>
<script>
    document.getElementById("coachingForm").addEventListener("submit", function(event) {
        event.preventDefault();

        const requestType = document.getElementById("request-type").value;
        const priority = document.getElementById("priority").value;
        const message = document.getElementById("message").value.trim();

        if (requestType === "" || message === "") {
            alert("Please select a request type and enter a message.");
            return;
        }

        localStorage.setItem("fitWarsRequestType", requestType);
        localStorage.setItem("fitWarsPriority", priority);
        localStorage.setItem("fitWarsRequestMessage", message);

        document.getElementById("successMessage").style.display = "block";

        this.reset();
    });
</script>
</body>

</html>
